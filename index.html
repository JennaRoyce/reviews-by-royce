<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews by Royce</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Poppins', sans-serif;
  background:#f4f8f4;
  color:#2f3e2f;
}

header {
  font-family:'Playfair Display', serif;
  text-align:center;
  padding:35px 20px;
  font-size:2.4rem;
  background:linear-gradient(to right,#dce8df,#eef5f0);
}

.subtitle {
  font-size:1rem;
  margin-top:8px;
  color:#6c8a6f;
}

nav {
  display:flex;
  justify-content:center;
  gap:15px;
  padding:15px;
}

nav button {
  background:white;
  border:none;
  padding:10px 22px;
  border-radius:25px;
  cursor:pointer;
  color:#4f6f52;
  box-shadow:0 4px 10px rgba(0,0,0,0.06);
}

.page {display:none; max-width:1000px; margin:auto; padding:20px;}
.active {display:block;}

.section-card {
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:25px;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
  border:1px solid #e3efe3;
}

.current-reading {
  display:flex;
  gap:20px;
  align-items:center;
}

.current-reading img {
  width:120px;
  border-radius:10px;
}

.search-bar {
  width:100%;
  padding:12px;
  border-radius:25px;
  border:none;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  margin-bottom:20px;
}

#bookList {
  column-count:3;
  column-gap:20px;
}

.book-card {
  break-inside:avoid;
  background:white;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
  overflow:hidden;
  border:1px solid #e3efe3;
}

.book-card img {width:100%;}

.card-content {padding:15px;}

.goodreads {
  display:inline-block;
  margin-top:10px;
  font-size:0.9rem;
  text-decoration:none;
  color:#6b8f71;
}

@media(max-width:900px){#bookList{column-count:2;}}
@media(max-width:600px){#bookList{column-count:1;}}
</style>
</head>

<body>

<header>
  🌿 Reviews by Royce 🌿
  <div class="subtitle">your next obsession starts here</div>
</header>

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('reviews')">Library</button>
<button onclick="showPage('spice')">Spice Guide</button>
</nav>

<div id="home" class="page active">

<div class="section-card">
<h2>🌸 Currently Reading</h2>
<div class="current-reading" id="currentReading"></div>
</div>

<div class="section-card">
<h2>Welcome</h2>
<p>romantasy, slow burns, emotional damage, and stories that stay with you ✨</p>
</div>

</div>

<div id="reviews" class="page">
<h2>Library</h2>
<input class="search-bar" id="search" placeholder="search..." oninput="renderBooks()">
<div id="bookList"></div>
</div>

<div id="spice" class="page">
<h2>Spice Guide 🌶️</h2>
<p>🌶️ soft</p>
<p>🌶️🌶️ tension</p>
<p>🌶️🌶️🌶️ open door</p>
<p>🌶️🌶️🌶️🌶️ steamy</p>
<p>🌶️🌶️🌶️🌶️🌶️ 🔥</p>
</div>

<script>
const SHEET_URL = "PASTE_YOUR_API_LINK_HERE";

let books = [];

async function fetchBooks(){
  const res = await fetch(SHEET_URL);
  books = await res.json();
  renderBooks();
  renderCurrent();
}

function renderCurrent(){
  const current = books.find(b => b.current === "yes");
  if(!current) return;

  document.getElementById("currentReading").innerHTML = `
    <img src="${current.image}">
    <div>
      <h3>${current.title}</h3>
      <p><b>${current.author}</b></p>
      <p>${current.summary}</p>
    </div>
  `;
}

function renderBooks(){
  const term = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("bookList");
  list.innerHTML = "";

  books
    .filter(b => b.title.toLowerCase().includes(term))
    .forEach(book => {
      const card = document.createElement("div");
      card.className = "book-card";

      card.innerHTML = `
        <img src="${book.image}">
        <div class="card-content">
          <h3>${book.title}</h3>
          <p><b>${book.author}</b></p>
          <p>${book.summary}</p>
          <p>${"⭐".repeat(book.rating)}</p>
          <p>${"🌶️".repeat(book.spice)}</p>
          <a class="goodreads" href="${book.goodreads}" target="_blank">Goodreads →</a>
        </div>
      `;
      list.appendChild(card);
    });
}

function showPage(page){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
}

fetchBooks();
setInterval(fetchBooks, 10000);
</script>

</body>
</html>
